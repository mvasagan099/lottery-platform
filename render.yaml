databases:
  - name: lottery-db
    plan: free
    databaseName: lottery_db
    user: lottery_user

services:
  - type: redis
    name: lottery-redis
    plan: free
    ipAllowList: [] # Allow internal connections only

  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: lottery-backend
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run db:migrate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: warn
      - key: DATABASE_URL
        fromDatabase:
          name: lottery-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: lottery-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Comma-separated list of allowed frontend origins
      # e.g. https://lottery-frontend-xxxx.onrender.com,https://yourdomain.com
      - key: ALLOWED_ORIGINS
        sync: false
      # URL of deployed frontend (used in emails for reset links etc.)
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: FROM_EMAIL
        sync: false
      # Coupon platform integration
      - key: COUPON_API_URL
        sync: false
      - key: COUPON_API_KEY
        sync: false
      # Payment gateways (set whichever you use)
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false

  # ── Frontend Static Site ─────────────────────────────────────────────────────
  - type: web
    name: lottery-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: false
    routes:
      # SPA fallback — all non-asset paths serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Hashed assets get 1-year immutable cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), payment=()"
    envVars:
      # Fill in your actual deployed backend URL
      - key: VITE_API_URL
        sync: false

